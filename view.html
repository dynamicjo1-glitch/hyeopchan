<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>협찬 진행 현황</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f5f6f8;color:#1f2933}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 40px}h1{font-size:20px;margin:4px 0 2px}.sub{color:#6b7280;font-size:13px;margin-bottom:14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.sum a{background:#fff;border-radius:12px;padding:12px 8px;text-align:center;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(0,0,0,.05)}.sum b{display:block;font-size:22px}.sum span{font-size:12px;color:#6b7280}
h2{font-size:16px;margin:20px 2px 8px}.card{background:#fff;border-radius:12px;padding:4px 14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eef0f3}.row:last-child{border-bottom:0}.l{min-width:0}.l b{font-size:15px}.l b a{color:inherit;text-decoration:none}.meta{display:block;font-size:12.5px;color:#6b7280;margin-top:3px;line-height:1.5}
.st{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:99px;margin-top:5px;background:#eef2ff;color:#3730a3}.st.r{background:#fff1f2;color:#be123c}.st.o{background:#fff7ed;color:#c2410c}.st.g{background:#ecfdf5;color:#047857}
.post{display:inline-block;margin-top:6px;font-size:13px;color:#2563eb;text-decoration:none}.dd{flex:none;font-size:12px;color:#374151;text-align:right;white-space:nowrap}.dd small{display:block;color:#9ca3af}
.pill{font-size:11px;padding:1px 6px;border-radius:6px;margin-right:4px;background:#e5e7eb}.pill.v{background:#fde68a}.pill.s{background:#bfdbfe}.empty{padding:14px 0;color:#9ca3af;font-size:13px}.foot{color:#9ca3af;font-size:12px;margin-top:18px;text-align:center}</style></head>
<body><div class="wrap"><h1>협찬 진행 현황</h1><div class="sub">블로그 「일단해봄」 · 읽기 전용 페이지예요. 보기만 할 수 있어요.</div><div id="m"><div class="empty">불러오는 중…</div></div><div class="foot" id="f"></div></div>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kst=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);const today=kst();
const md=s=>s?(+s.slice(5,7))+'/'+(+s.slice(8,10)):'';const dw=s=>s?'일월화수목금토'[new Date(s+'T00:00:00+09:00').getDay()]:'';
const dd=s=>{if(!s)return'';const n=Math.round((Date.parse(s+'T00:00:00+09:00')-Date.parse(today+'T00:00:00+09:00'))/864e5);return n<0?'지남':n===0?'오늘':'D-'+n};
function stage(x){if(x.state==='발표전')return'G';if(x.state==='완료')return'H';if(x.step)return x.step;if(x.post)return'D';if(x.type==='방문'){if(!x.visit)return'A';if(x.visit>today)return'B'}return'C'}
const STG={A:['방문 예약 전','r'],B:['방문 예정','o'],C:['리뷰 작성 중','r'],D:['글 작성 · 사이트 등록 전','r'],G:['발표 기다림','g'],H:['리뷰 등록 완료','g']};
const clean=s=>String(s||'').replace(/https?:\/\/\S+/g,'').replace(/\(\s*\)/g,'').replace(/쿠폰[^·,]*/g,'').replace(/\s+·\s*·/g,' ·').replace(/^[\s·,]+|[\s·,]+$/g,'');
function row(x,k){const sub=[x.s,x.visit?'방문 '+md(x.visit)+'('+dw(x.visit)+')':'',clean(x.note)].filter(Boolean).join(' · ');
 const right=k==='H'?'결과 '+(x.res?md(x.res):'대기'):k==='G'?(x.ann?'발표 '+md(x.ann):''):(x.due?'마감 '+md(x.due)+'<small>'+dd(x.due)+'</small>':'');
 return '<div class="row"><div class="l"><b><span class="pill '+(x.type==='방문'?'v':'s')+'">'+esc(x.type||'')+'</span>'+(x.u?'<a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.n)+'</a>':esc(x.n))+'</b><span class="meta">'+esc(sub)+'</span><span class="st '+STG[k][1]+'">'+esc(STG[k][0])+'</span>'+(x.post?'<br><a class="post" href="'+esc(x.post)+'" target="_blank" rel="noopener">블로그 글 열기 ›</a>':'')+'</div><div class="dd">'+right+'</div></div>'}
fetch('status.json?v='+Date.now()).then(r=>r.json()).then(j=>{const I=j.items||[];const G={A:[],B:[],C:[],D:[],G:[],H:[]};for(const x of I){const k=stage(x);(G[k]||(G[k]=[])).push(x)}
 const prog=[...G.A,...G.B,...G.C,...G.D].sort((a,b)=>(a.due||'').localeCompare(b.due||''));G.G.sort((a,b)=>(a.ann||'').localeCompare(b.ann||''));G.H.sort((a,b)=>(a.res||'').localeCompare(b.res||''));
 const sec=(id,t,L,f)=>'<h2 id="'+id+'">'+t+' '+L.length+'</h2><div class="card">'+(L.length?L.map(f).join(''):'<div class="empty">없어요</div>')+'</div>';
 let h='<div class="sum"><a href="#p"><b>'+prog.length+'</b><span>진행 중</span></a><a href="#g"><b>'+G.G.length+'</b><span>발표 기다림</span></a><a href="#h"><b>'+G.H.length+'</b><span>리뷰 등록 완료</span></a></div>';
 h+=sec('p','진행 중',prog,x=>row(x,stage(x)));h+=sec('g','발표 기다림',G.G,x=>row(x,'G'));h+=sec('h','리뷰 등록 완료',G.H,x=>row(x,'H'));
 document.getElementById('m').innerHTML=h;document.getElementById('f').textContent='마지막 업데이트 '+(j.updated||'');}).catch(()=>{document.getElementById('m').innerHTML='<div class="empty">현황을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</div>'});
</script></body></html>
