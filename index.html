<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14535C"><meta name="robots" content="noindex"><title>협찬 고르기</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--t:#14535C;--p:#FFB7C9;--c:#FFF8EE;--line:#eadfcf;--mut:#6b7280}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--c);color:#1f2328;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--t);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.hrow{display:flex;align-items:center;gap:8px}h1{margin:0;font-size:17px;flex:1}h1 small{font-weight:400;opacity:.75;font-size:12px;margin-left:6px}
.hbtn{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:7px 10px;font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;border-radius:18px;padding:8px 12px;font-size:13.5px;background:rgba(255,255,255,.15);color:#fff}.tab.on{background:#fff;color:var(--t);font-weight:700}.tab i{font-style:normal;opacity:.7;margin-left:4px;font-size:12px}
.tools{background:#fff;border-bottom:1px solid var(--line);padding:8px 12px}.srow{display:flex;gap:8px}.srow input{flex:1;min-width:0;border:1px solid #d6d3cc;border-radius:10px;padding:9px 11px;font-size:15px;background:#fafafa}
.srow select{border:1px solid #d6d3cc;border-radius:10px;padding:0 8px;font-size:13px;background:#fafafa}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px}.chip{flex:0 0 auto;border:1px solid #d6d3cc;background:#fff;border-radius:16px;padding:6px 12px;font-size:13px;color:#374151}.chip.on{border-color:var(--t);background:#e7f1f2;color:var(--t);font-weight:700}.chip.gu{border-style:dashed}.chip.tg{background:#fffbeb}
.sum{font-size:12.5px;color:var(--mut);padding:8px 14px 0;display:flex;justify-content:space-between}main{padding:4px 10px}
.card{background:#fff;border-radius:14px;padding:12px;margin:8px 0;box-shadow:0 1px 3px rgba(0,0,0,.07);border:2px solid transparent}.card.sel{border-color:var(--p);background:#fff8fb}
.r1{display:flex;gap:8px;align-items:flex-start}.nm{flex:1;min-width:0;font-weight:800;font-size:16px;color:#111;text-decoration:none;line-height:1.35}
.sub{font-size:12.5px;color:var(--mut);margin-top:2px}.ms{font-size:12.5px;color:#374151;margin-top:7px;background:#f8fafc;border-radius:8px;padding:6px 8px}
.bs{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.b{font-size:11.5px;border-radius:6px;padding:2px 7px;background:#f3f4f6;color:#374151;font-weight:600}
.s-레뷰{background:#ede9fe;color:#5b21b6}.s-리뷰노트{background:#dbeafe;color:#1d4ed8}.s-강남{background:#ffedd5;color:#c2410c}.s-디너{background:#fce7f3;color:#be185d}
.d1{background:#fee2e2;color:#b91c1c}.d2{background:#ffedd5;color:#c2410c}.k1{background:#dcfce7;color:#15803d}.k2{background:#e0f2f1;color:#0f766e}.k3{background:#fee2e2;color:#b91c1c}.w{background:#fef9c3;color:#854d0e}.x{background:#fff1f2;color:#9f1239}.ap{background:var(--t);color:#fff}.nw{background:#14535C;color:#fff}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;border-radius:9px;padding:8px;font-weight:700;font-size:13.5px}.add{border:1.5px solid var(--t);background:#fff;color:var(--t)}.sel .add{background:var(--t);color:#fff}.hide{border:1px solid #e5e7eb;background:#fafafa;color:#6b7280}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.bar .cnt{flex:1;font-size:14px}.bar .cnt b{color:var(--t)}.bar button{border:0;border-radius:10px;padding:11px 13px;font-weight:800;font-size:14px}.btn-l{background:#f3f4f6;color:#374151}.btn-p{background:var(--t);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9;display:none;align-items:flex-end}.sheet.on{display:flex}.sheet>div{background:#fff;width:100%;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:4px 0 8px;font-size:16px}.li{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #f1f1f1;font-size:14px}.li span{flex:1}.li small{color:var(--mut)}.li button{border:0;background:#f3f4f6;border-radius:8px;padding:6px 10px;font-size:12.5px}
.kwrow{display:flex;gap:8px;margin:6px 0 4px}.kwrow input{flex:1;border:1px solid #d6d3cc;border-radius:10px;padding:9px;font-size:15px}.kwrow button{border:0;border-radius:10px;padding:0 14px;background:var(--t);color:#fff;font-weight:700}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.kw{background:#f3f4f6;border-radius:14px;padding:5px 10px;font-size:13px}.kw button{border:0;background:none;color:#9ca3af;margin-left:4px;font-size:13px}
.note{font-size:12.5px;color:var(--mut)}.empty{text-align:center;color:var(--mut);padding:40px 10px}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:10px;font-size:13.5px;display:none;z-index:10;max-width:90%}
.big{width:100%;border:0;border-radius:10px;padding:12px;font-weight:800;font-size:15px;margin-top:8px}
</style></head><body>
<header><div class="hrow"><h1>협찬 고르기<small id="upd"></small><small id="sv"></small></h1><button class="hbtn" id="mng">가리기 관리</button></div><div class="tabs" id="tabs"></div></header>
<div class="tools"><div class="srow"><input id="q" type="search" placeholder="뭘 받는지·가게 이름 검색"><select id="sort"><option value="d">마감 빠른 순</option><option value="k">경쟁 낮은 순</option><option value="n">새로 올라온 순</option></select></div><div class="chips" id="ch"></div></div>
<div class="sum"><span id="sum"></span><span id="hid"></span></div><main id="m"><div class="empty">불러오는 중…</div></main>
<div class="bar"><div class="cnt">담은 것 <b id="n">0</b>개</div><button class="btn-l" id="see">보기</button><button class="btn-p" id="cp">신청 목록 보내기</button></div>
<div class="sheet" id="sh"><div id="shc"></div></div><div class="toast" id="to"></div>
<script>
const $=id=>document.getElementById(id);const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let D=[],META={},hide=new Set(ls.get('hc_hide',[])),pick=new Set(ls.get('hc_pick',[])),kws=ls.get('hc_kw',[]);
const TW=window.Telegram&&Telegram.WebApp;const CLOUD=!!(TW&&TW.initData&&TW.CloudStorage&&(!TW.isVersionAtLeast||TW.isVersionAtLeast('6.9')));
try{if(TW){TW.ready();TW.expand()}}catch(e){}try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const cGet=keys=>new Promise(r=>{try{TW.CloudStorage.getItems(keys,(e,v)=>r(e?null:v))}catch(e){r(null)}});
const cSet=(k,v)=>new Promise(r=>{try{TW.CloudStorage.setItem(k,v,(e)=>r(!e))}catch(e){r(false)}});
async function cloudSave(name,val){const s=JSON.stringify(val);const parts=[];for(let i=0;i<s.length;i+=3500)parts.push(s.slice(i,i+3500));for(let i=0;i<parts.length;i++)await cSet(name+'_'+i,parts[i]);await cSet(name+'_n',String(parts.length))}
async function cloudLoad(name){const n=await cGet([name+'_n']);if(!n||!n[name+'_n'])return null;const cnt=+n[name+'_n'];const keys=[...Array(cnt)].map((_,i)=>name+'_'+i);const v=await cGet(keys);if(!v)return null;try{return JSON.parse(keys.map(k=>v[k]||'').join(''))}catch(e){return null}}
let saveT=null;function persist(){ls.set('hc_hide',[...hide]);ls.set('hc_pick',[...pick]);ls.set('hc_kw',kws);if(!CLOUD)return;clearTimeout(saveT);saveT=setTimeout(async()=>{await cloudSave('hide',[...hide]);await cloudSave('pick',[...pick]);await cloudSave('kw',kws);const x=document.getElementById('sv');if(x){x.textContent='저장됨';setTimeout(()=>x.textContent='',1200)}},500)}
async function cloudInit(){if(!CLOUD)return;const [h2,p2,k2]=[await cloudLoad('hide'),await cloudLoad('pick'),await cloudLoad('kw')];if(h2||p2||k2){if(h2)h2.forEach(x=>hide.add(x));if(p2)p2.forEach(x=>pick.add(x));if(k2)k2.forEach(x=>{if(!kws.includes(x))kws.push(x)})}persist()}
const T=[['C','창원 주말 가능'],['U','창원 주말 확인 필요'],['N','창원 평일만'],['S','배송 제품'],['P','페이백·구매'],['K','기자단·재택']];
let st={g:'C',chip:'전체',q:'',sort:'d'};const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kst=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);let today=kst(),tom=new Date(Date.now()+33*3600e3).toISOString().slice(0,10);
const md=s=>s?(+s.slice(5,7))+'/'+(+s.slice(8,10)):'';const dw=s=>s?'일월화수목금토'[new Date(s+'T00:00:00+09:00').getDay()]:'';const kr=d=>(d.a==null||!d.q)?null:d.a/d.q;
const wmap={'토만':'토요일만','일만':'일요일만','추정':'주말 가능(추정)','토만·추정':'토요일만(추정)','일만·추정':'일요일만(추정)'};
const kwHit=d=>kws.find(k=>k&&(d.n+' '+d.t).toLowerCase().includes(k.toLowerCase()));
const live=d=>!d.e||d.e>=today;const visible=d=>live(d)&&!hide.has(d.k)&&!kwHit(d);
function chipsFor(g){const L=D.filter(d=>d.g===g&&visible(d));const cats=[...new Set(L.map(d=>d.c).filter(Boolean))].sort((a,b)=>L.filter(d=>d.c===b).length-L.filter(d=>d.c===a).length);let c=['전체',...cats.filter(x=>x!=='기타')];if(cats.includes('기타'))c.push('기타');if('CUN'.includes(g))c=c.concat(['성산구','의창구','마산합포구','마산회원구','진해구'].filter(x=>L.some(d=>d.gu===x)));if(g==='C')c.push('토요일 가능','일요일 가능');if(L.some(d=>d.nw===META.date))c.splice(1,0,'오늘 새로');return c}
function pass(d){const c=st.chip;if(c==='전체')return true;if(c==='오늘 새로')return d.nw===META.date;if(c==='토요일 가능')return!/일만/.test(d.w||'');if(c==='일요일 가능')return!/토만/.test(d.w||'');if(/구$/.test(c))return d.gu===c;return d.c===c}
function kb(d){const k=kr(d);if(k==null)return'';const t='지원 '+d.a+' · 모집 '+d.q;return k<1?'<span class="b k1">여유 · '+t+'</span>':k<5?'<span class="b k2">경쟁 낮음 · '+t+'</span>':k<20?'<span class="b">'+t+'</span>':'<span class="b k3">경쟁 치열 · '+t+'</span>'}
function db(d){if(!d.e)return'';if(d.e===today)return'<span class="b d1">오늘 마감</span>';if(d.e===tom)return'<span class="b d2">내일 마감</span>';return'<span class="b">'+md(d.e)+'('+dw(d.e)+') 마감</span>'}
function card(d){const on=pick.has(d.k);return'<div class="card'+(on?' sel':'')+'" data-k="'+esc(d.k)+'"><div class="r1"><a class="nm" href="'+esc(d.u)+'" target="_blank" rel="noopener">'+esc(d.n)+'</a></div><div class="sub">'+esc([d.c,d.t].filter(Boolean).join(' · '))+'</div><div class="bs">'+(d.nw===META.date?'<span class="b nw">새로</span>':'')+'<span class="b s-'+d.s+'">'+d.s+'</span>'+db(d)+(d.w?'<span class="b w">'+(wmap[d.w]||d.w)+'</span>':'')+(d.gu&&d.gu!=='창원'?'<span class="b">'+d.gu+'</span>':'')+kb(d)+(d.x||[]).map(x=>'<span class="b x">'+esc(x)+'</span>').join('')+(d.ap?'<span class="b ap">이미 신청함</span>':'')+'</div>'+(d.m?'<div class="ms">'+esc(d.m)+'</div>':'')+'<div class="acts"><button class="add">'+(on?'담음':'담기')+'</button><button class="hide">가리기</button></div></div>'}
function draw(){today=kst();
 $('tabs').innerHTML=T.map(([g,l])=>'<button class="tab'+(st.g===g?' on':'')+'" data-g="'+g+'">'+l+'<i>'+D.filter(d=>d.g===g&&visible(d)).length+'</i></button>').join('');
 const cs=chipsFor(st.g);if(!cs.includes(st.chip))st.chip='전체';$('ch').innerHTML=cs.map(c=>'<button class="chip'+(st.chip===c?' on':'')+(/구$/.test(c)?' gu':'')+(/요일|새로/.test(c)?' tg':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join('');
 const q=st.q.trim().toLowerCase();let L=D.filter(d=>d.g===st.g&&visible(d)&&pass(d)&&(!q||(d.n+' '+d.t+' '+(d.o||'')).toLowerCase().includes(q)));
 if(st.sort==='k')L.sort((a,b)=>(kr(a)??1e9)-(kr(b)??1e9));else if(st.sort==='n')L.sort((a,b)=>(b.nw||'').localeCompare(a.nw||'')||(a.e||'').localeCompare(b.e||''));
 $('sum').textContent=L.length+'개'+(st.chip!=='전체'?' · '+st.chip:'')+(q?' · "'+st.q+'"':'');const hc=D.filter(d=>live(d)&&(hide.has(d.k)||kwHit(d))).length;$('hid').textContent=hc?'가린 것 '+hc+'개':'';
 let h='',last='';for(const d of L){if(st.sort==='d'&&d.e!==last){last=d.e;h+='<div class="sub" style="margin:14px 4px 4px;font-weight:800;color:'+(d.e===today?'#b91c1c':'#0e3f46')+'">'+(d.e===today?'오늘 마감':d.e===tom?'내일 마감':md(d.e)+'('+dw(d.e)+') 마감')+'</div>'}h+=card(d)}
 $('m').innerHTML=h||'<div class="empty">조건에 맞는 게 없어요</div>';$('n').textContent=[...pick].filter(k=>D.some(d=>d.k===k&&live(d))).length}
function toast(t){const x=$('to');x.textContent=t;x.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.display='none',1800)}
function picked(){return D.filter(d=>pick.has(d.k)&&live(d))}
function text(){const L=picked();return'신청해줘 ('+L.length+'개)\n'+L.map((d,i)=>(i+1)+'. '+d.n+' ('+d.t+') ['+d.s+'] '+d.u).join('\n')}
function sheetPick(){const L=picked();$('shc').innerHTML='<h3>담은 것 '+L.length+'개</h3>'+(L.length?L.map(d=>'<div class="li"><span>'+esc(d.n)+'<br><small>'+esc(d.t)+' · '+d.s+' · '+md(d.e)+' 마감</small></span><button data-unpick="'+esc(d.k)+'">빼기</button></div>').join(''):'<div class="empty">아직 담은 게 없어요</div>')+'<button class="big btn-p" id="send">텔레그램으로 보내기</button><button class="big btn-l" id="copy">복사만 하기</button><button class="big btn-l" id="clrp">담은 것 비우기</button><p class="note">보내기를 누르면 텔레그램이 열려요. 블로그 봇(Blog4451bot) 대화방을 골라 보내 주시면 돼요.</p>';$('sh').classList.add('on')}
function sheetMng(){const H=D.filter(d=>live(d)&&hide.has(d.k));$('shc').innerHTML='<h3>단어로 가리기</h3><p class="note">이 단어가 이름에 들어간 건 지금 있는 것도, 내일 새로 올라오는 것도 다 가려져요.</p><div class="kwrow"><input id="kwi" placeholder="예: 소개팅, 웨딩"><button id="kwa">추가</button></div><div class="kws">'+kws.map((k,i)=>'<span class="kw">'+esc(k)+'<button data-kwdel="'+i+'">✕</button></span>').join('')+'</div><h3 style="margin-top:16px">하나씩 가린 것 '+H.length+'개</h3>'+(H.length?H.map(d=>'<div class="li"><span>'+esc(d.n)+'<br><small>'+esc(d.t)+' · '+d.s+'</small></span><button data-unhide="'+esc(d.k)+'">다시 보기</button></div>').join(''):'<div class="note">아직 없어요. 카드의 가리기를 누르면 여기 모여요.</div>')+'<p class="note" style="margin-top:14px">'+(CLOUD?'텔레그램 계정에 저장돼요. 껐다 켜도, 폰을 바꿔도, 매일 목록이 바뀌어도 그대로예요.':'이 브라우저에 저장돼요. 사파리라면 홈 화면에 추가해서 그 아이콘으로 여는 게 제일 안전해요. 텔레그램 버튼으로 연 것과는 따로 저장돼요.')+'</p>';$('sh').classList.add('on')}
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();return ok}}
document.addEventListener('click',async e=>{const t=e.target;
 if(t.closest('.tab')){st.g=t.closest('.tab').dataset.g;st.chip='전체';draw();scrollTo(0,0);return}
 if(t.closest('.chip')){st.chip=t.closest('.chip').dataset.c;draw();return}
 const c=t.closest('.card');if(c&&t.classList.contains('add')){const k=c.dataset.k;pick.has(k)?pick.delete(k):pick.add(k);persist();c.classList.toggle('sel',pick.has(k));t.textContent=pick.has(k)?'담음':'담기';$('n').textContent=picked().length;return}
 if(c&&t.classList.contains('hide')){const k=c.dataset.k;hide.add(k);pick.delete(k);persist();persist();c.style.display='none';toast('가렸어요. 위의 가리기 관리에서 되돌릴 수 있어요');draw();return}
 if(t.dataset.unpick){pick.delete(t.dataset.unpick);persist();sheetPick();draw();return}
 if(t.dataset.unhide){hide.delete(t.dataset.unhide);persist();sheetMng();draw();return}
 if(t.dataset.kwdel!=null){kws.splice(+t.dataset.kwdel,1);persist();sheetMng();draw();return}
 if(t.id==='kwa'){const v=$('kwi').value.trim();if(v&&!kws.includes(v)){kws.push(v);ls.set('hc_kw',kws)}sheetMng();draw();return}
 if(t.id==='send'){const L=picked();if(!L.length){toast('먼저 담아 주세요');return}const tx=text();await copy(tx);const sh='https://t.me/share/url?url='+encodeURIComponent('https://t.me/Blog4451bot')+'&text='+encodeURIComponent(tx);if(TW&&TW.openTelegramLink&&CLOUD){TW.openTelegramLink(sh)}else{location.href=sh}return}
 if(t.id==='copy'){if(!picked().length){toast('먼저 담아 주세요');return}toast(await copy(text())?'복사했어요':'복사가 안 됐어요');return}
 if(t.id==='clrp'){if(confirm('담은 것을 비울까요?')){pick.clear();persist();sheetPick();draw()}return}
 if(t.id==='sh'){$('sh').classList.remove('on')}});
$('q').oninput=e=>{st.q=e.target.value;draw()};$('sort').onchange=e=>{st.sort=e.target.value;draw()};$('see').onclick=sheetPick;$('cp').onclick=sheetPick;$('mng').onclick=sheetMng;
cloudInit().then(()=>fetch('data.json?v='+Date.now())).then(r=>r.json()).then(j=>{D=j.items;META=j;$('upd').textContent=j.date.slice(5).replace('-','/')+' '+(j.time||'')+' 업데이트';draw()}).catch(e=>{$('m').innerHTML='<div class="empty">목록을 못 불러왔어요. 잠시 뒤 새로고침해 주세요.</div>'});
</script></body></html>
