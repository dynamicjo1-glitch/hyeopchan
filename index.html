function wkStart(s){const d=new Date(s+'T00:00:00+09:00');const day=(d.getDay()+6)%7;return new Date(d.getTime()-day*864e5+9*3600e3).toISOString().slice(0,10)}
function weekends(n){const out=[];let d=new Date(today+'T00:00:00+09:00');while(d.getDay()!==6)d=new Date(d.getTime()+864e5);if(new Date(today+'T00:00:00+09:00').getDay()===0)d=new Date(d.getTime()-7*864e5);for(let i=0;i<n;i++){const sat=new Date(d.getTime()+i*7*864e5+9*3600e3).toISOString().slice(0,10);const sun=new Date(d.getTime()+(i*7+1)*864e5+9*3600e3).toISOString().slice(0,10);out.push([sat,sun])}return out}
function addDay(s,n){return new Date(Date.parse(s+'T00:00:00+09:00')+n*864e5+9*3600e3).toISOString().slice(0,10)}
function dd(s){if(!s)return'';const n=Math.round((Date.parse(s+'T00:00:00+09:00')-Date.parse(today+'T00:00:00+09:00'))/864e5);return n<0?'지남':n===0?'오늘':'D-'+n}
function srcOf(x){return D.find(d=>(x.ks||[]).includes(d.k))}
function canDay(x,day){const st0=x.start||(x.ann?addDay(x.ann,1):null);if(st0&&day<st0)return false;if(x.due&&day>x.due)return false;const d0=srcOf(x)||{};const w=x.w||d0.w||'';const g=x.g||d0.g||'';const note=(x.note||'')+' '+(d0.m||'');const dow=dw(day);if(g==='N')return false;if(/토만/.test(w)&&dow!=='토')return false;if(/일만/.test(w)&&dow!=='일')return false;if(dow==='토'&&/(금·토|금,토|토요일|토) ?불가|토 불가|일~목/.test(note))return false;if(dow==='일'&&/일요일 불가|일 불가|월~토/.test(note))return false;return true}
function drawTodo(){const I=STA.items||[];const R=STA.rules||{};const maxC=R.visitConfirmPerWeek||2;let h='';
 h+='<h2 class="s">이번 주말 · 다음 주말</h2>';for(const [sa,su] of weekends(2)){h+='<div class="wk">';for(const day of [sa,su]){const busy=(STA.busy||[]).find(b=>b.d===day);const conf=I.filter(x=>x.type==='방문'&&x.state==='확정'&&x.visit===day);const cand=I.filter(x=>x.type==='방문'&&x.state==='발표전'&&canDay(x,day));
  h+='<div class="d'+(busy?' busy':'')+'"><b>'+md(day)+' '+dw(day)+'</b><div class="n">'+(busy?esc(busy.t)+' · 방문형 피하기':conf.length>=maxC?'꽉 참':conf.length?(maxC-conf.length)+'곳 더 가능':'비어 있음')+'</div>'+conf.map(x=>'<span class="ch ok">'+esc(x.n)+'</span>').join('')+(busy?'':cand.slice(0,3).map(x=>'<span class="ch">'+esc(String(x.n).replace(/\s*\(.*?\)\s*/g,' ').trim())+'</span>').join('')+(cand.length>3?'<span class="ch">+'+(cand.length-3)+' 대기</span>':''))+'</div>'}h+='</div>'}
 const conf=I.filter(x=>x.state==='확정').sort((a,b)=>(a.due||'').localeCompare(b.due||''));
 h+='<h2 class="s">확정 · 해야 할 것 '+conf.length+'</h2><div class="card">'+(conf.length?conf.map(x=>'<div class="row"><div class="l"><b>'+esc(x.n)+'</b><span>'+esc([x.type,x.s,x.visit?'방문 '+md(x.visit):(x.type==='방문'?'방문 날짜 미정':''),x.todo||x.note].filter(Boolean).join(' · '))+'</span></div>'+(x.due?'<span class="dd">'+dd(x.due)+' · '+md(x.due)+'</span>':'')+'</div>').join(''):'<div class="empty">지금은 없어요</div>')+'</div>';
 const pend=I.filter(x=>x.state==='발표전');const byAnn={};for(const x of pend)(byAnn[x.ann||'미정']||=[]).push(x);const anns=Object.keys(byAnn).sort();
 h+='<h2 class="s">발표 기다리는 중 '+pend.length+'</h2><div class="card">'+(anns.length?anns.map(a=>{const L=byAnn[a];const bs={};for(const x of L)bs[x.s]=(bs[x.s]||0)+1;const past=a!=='미정'&&a<today;return'<details class="ex"><summary><div class="row"><div class="l"><b>'+(a==='미정'?'발표일 미정':md(a)+' '+dw(a)+(a===today?' 오늘':past?' (결과 확인 중)':''))+'</b><span>'+esc(Object.entries(bs).map(([s,c])=>s+' '+c).join(' · '))+'</span></div><span class="cnt">'+L.length+'건 ▸</span></div></summary><div class="in">'+L.map(x=>'<div class="li"><span><span class="pill '+(x.type==='방문'?'v':'s')+'">'+esc(x.type)+'</span>'+(x.u?'<a href="'+esc(x.u)+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">'+esc(x.n)+'</a>':esc(x.n))+'<br><small>'+esc([x.s,x.note,x.due?'리뷰 '+md(x.due)+'까지':''].filter(Boolean).join(' · '))+'</small></span></div>').join('')+'</div></details>'}).join(''):'<div class="empty">없어요</div>')+'</div>';
 const done=I.filter(x=>x.state==='완료');if(done.length)h+='<div class="card"><details class="ex"><summary><div class="row"><div class="l"><b>끝난 것</b></div><span class="cnt">'+done.length+'건 ▸</span></div></summary><div class="in">'+done.map(x=>'<div class="li"><span>'+esc(x.n)+'<br><small>'+esc([x.s,x.note].filter(Boolean).join(' · '))+'</small></span></div>').join('')+'</div></details></div>';
 h+='<div class="card"><details class="ex"><summary><div class="row"><div class="l"><b>우리 규칙 · 부부 일정</b></div><span class="cnt">▸</span></div></summary><div class="in rule">'+((R.text)||[]).map(t=>'· '+esc(t)).join('<br>')+(STA.busy&&STA.busy.length?'<br><br><b>부부 일정</b><br>'+STA.busy.map(b=>'· '+md(b.d)+'('+dw(b.d)+') '+esc(b.t)).join('<br>'):'')+'<br><br>일정은 구글 캘린더 "협찬(발표전_마감일정)" "협찬(확정_마감일정)"에도 있어요 (귤=방문, 공작=배송).</div></details></div>';
 h+='<p class="note">현황 업데이트 '+esc(STA.updated||'')+'</p>';return h}
function picked(){return D.filter(d=>pickBy.has(d.k)&&live(d)&&!hide.has(d.k)&&!applied(d)).sort((a,b)=>TYO[TY(a)]-TYO[TY(b)]||(a.e||'').localeCompare(b.e||''))}
function text(){const L=picked();let out='신청해줘 ('+L.length+'개)',cur='',i=0;for(const d of L){const t=TY(d);if(t!==cur){cur=t;out+='\n\n■ '+t+' '+L.filter(x=>TY(x)===t).length+'개'}i++;out+='\n'+i+'. ['+(pickBy.get(d.k)||[]).join('·')+'] '+d.n+' ('+d.t+(d.gu&&'CUN'.includes(d.g)?' · '+d.gu:'')+') ['+d.s+' · '+md(d.e)+' 마감] '+d.u}return out}
function drawPicked(){const L=picked();if(!L.length)return'<div class="empty">아직 담은 게 없어요. 고르기에서 ♡를 누르면 여기로 와요.<br><br>담지 않아도 "이번 주 다 넣어줘"라고 하면 마감 전 전부 신청해요.</div>';let h='<div class="sendrow"><button class="btn-p" id="send">텔레그램으로 보내기</button><button class="btn-l" id="copy">복사</button></div>';const who={};for(const d of L)for(const n of (pickBy.get(d.k)||[]))who[n]=(who[n]||0)+1;h+='<div class="note" style="margin:4px 2px 8px">'+Object.entries(who).map(([n,c])=>esc(n)+' '+c+'개').join(' · ')+'</div>';let cur='';h+='<div class="card">';for(const d of L){const t=TY(d);if(t!==cur){cur=t;h+='<div class="gh">'+t+' '+L.filter(x=>TY(x)===t).length+'</div>'}const by=pickBy.get(d.k)||[];h+='<div class="li" data-k="'+esc(d.k)+'"><span><b style="color:#9a4b06">'+esc(by.join('·'))+'</b> '+esc(d.n)+'<br><small>'+esc([d.t,'CUN'.includes(d.g)?d.gu:'',d.s,dl(d)].filter(Boolean).join(' · '))+'</small></span><button data-unp="'+esc(d.k)+'">'+(pick.has(d.k)?'빼기':'빼기('+esc(by.join('·'))+')')+'</button></div>'}return h+'</div>'}

 const q=st.q.trim().toLowerCase();let L=D.filter(d=>inG(d,st.g)&&avail(d)&&pass(d)&&(!q||(d.n+' '+d.t+' '+(d.o||'')).toLowerCase().includes(q)));
 if(st.sort==='k')L.sort((a,b)=>(kr(a)??1e9)-(kr(b)??1e9));else if(st.sort==='n')L.sort((a,b)=>(b.nw||'').localeCompare(a.nw||'')||(a.e||'').localeCompare(b.e||''));else L.sort((a,b)=>(a.e||'').localeCompare(b.e||''));
 $('sum').textContent=L.length+'개'+(st.chip!=='전체'?' · '+st.chip:'')+(q?' · "'+st.q+'"':'');const hc=D.filter(d=>live(d)&&(hide.has(d.k)||kwHit(d))).length;$('hid').textContent=hc?'가린 것 '+hc+'개':'';
 if(!L.length)return'<div class="empty">조건에 맞는 게 없어요</div>';let h='',last='';if(st.sort==='d'){for(const d of L){if(d.e!==last){if(last)h+='</div>';last=d.e;h+='<div class="gh'+(d.e===today||d.e===tom?' hot':'')+'">'+dl(d)+'</div><div class="grid">'}h+=card(d)}h+='</div>'}else h='<div class="grid" style="margin-top:10px">'+L.map(card).join('')+'</div>';return h}

async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();return ok}}
