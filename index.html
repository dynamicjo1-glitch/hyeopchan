<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14535C"><meta name="robots" content="noindex"><title>협찬 고르기</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>

.tools{background:#fff;border-bottom:1px solid var(--line);padding:8px 12px}.srow{display:flex;gap:8px}.srow input{flex:1;min-width:0;border:1px solid #d6d3cc;border-radius:10px;padding:9px 11px;font-size:15px;background:#fafafa}

.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;border-radius:9px;padding:8px;font-weight:700;font-size:13.5px}.add{border:1.5px solid var(--t);background:#fff;color:var(--t)}.sel .add{background:var(--t);color:#fff}.hide{border:1px solid #e5e7eb;background:#fafafa;color:#6b7280}

.bar .cnt{flex:1;font-size:14px}.bar .cnt b{color:var(--t)}.bar button{border:0;border-radius:10px;padding:11px 13px;font-weight:800;font-size:14px}.btn-l{background:#f3f4f6;color:#374151}.btn-p{background:var(--t);color:#fff}

.sheet h3{margin:4px 0 8px;font-size:16px}.li{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #f1f1f1;font-size:14px}.li span{flex:1}.li small{color:var(--mut)}.li button{border:0;background:#f3f4f6;border-radius:8px;padding:6px 10px;font-size:12.5px}
.kwrow{display:flex;gap:8px;margin:6px 0 4px}.kwrow input{flex:1;border:1px solid #d6d3cc;border-radius:10px;padding:9px;font-size:15px}.kwrow button{border:0;border-radius:10px;padding:0 14px;background:var(--t);color:#fff;font-weight:700}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.kw{background:#f3f4f6;border-radius:14px;padding:5px 10px;font-size:13px}.kw button{border:0;background:none;color:#9ca3af;margin-left:4px;font-size:13px}
.note{font-size:12.5px;color:var(--mut)}.empty{text-align:center;color:var(--mut);padding:40px 10px}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:10px;font-size:13.5px;display:none;z-index:10;max-width:90%}
.big{width:100%;border:0;border-radius:10px;padding:12px;font-weight:800;font-size:15px;margin-top:8px}
.card.sel2{border:2px dashed #FFB7C9}.b.pk{background:#FFE4EC;color:#9d174d;font-weight:800}.who{color:#9d174d}.meter{background:#FFF8EE;border:1px solid #f3d9b0;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;color:#5b4320}.meter.over{background:#fde8e8;border-color:#f5b5b5;color:#9b1c1c}.rule{background:#e8f3f4;border-radius:12px;padding:12px;font-size:14px;line-height:1.6;color:#0e3f46;margin:8px 0}.card.st.v{border-left:5px solid #f4511e}.card.st.s{border-left:5px solid #039be5}.b.ty-v{background:#ffe0d1;color:#b23c0f;font-weight:800}.b.ty-s{background:#d6effb;color:#0369a1;font-weight:800}.b.pp{background:#ede9fe;color:#5b21b6}.plan .pr{background:#fff;border-radius:12px;padding:10px 12px;margin:6px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}.b.gu{background:#e0f2f1;color:#0e3f46;font-weight:700}.ty{color:#0e3f46;background:#e0f2f1;border-radius:6px;padding:0 5px;font-size:12px}</style></head><body>
<header><div class="hrow"><h1>협찬 고르기<small id="upd"></small><small id="me" style="margin-left:6px;opacity:.85"></small></h1><button class="hbtn" id="mng">가리기 관리</button></div><div class="tabs" id="tabs"></div></header>
<div class="tools"><div class="srow"><input id="q" type="search" placeholder="뭘 받는지·가게 이름 검색"><select id="sort"><option value="d">마감 빠른 순</option><option value="k">경쟁 낮은 순</option><option value="n">새로 올라온 순</option></select></div><div class="chips" id="ch"></div></div>
<div class="sum"><span id="sum"></span><span id="hid"></span></div><main id="m"><div class="empty">불러오는 중…</div></main>
<div class="bar"><div class="cnt">담은 것 <b id="n">0</b>개</div><button class="btn-l" id="see">보기</button><button class="btn-p" id="cp">신청 목록 보내기</button></div>
<div class="sheet" id="sh"><div id="shc"></div></div><div class="toast" id="to"></div>
<script>
const $=id=>document.getElementById(id);const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let D=[],META={},hide=new Set(ls.get('hc_hide',[])),pick=new Set(ls.get('hc_pick',[])),kws=ls.get('hc_kw',[]);
const TW=window.Telegram&&Telegram.WebApp;const CLOUD=!!(TW&&TW.initData&&TW.CloudStorage&&(!TW.isVersionAtLeast||TW.isVersionAtLeast('6.9')));
try{if(TW){TW.ready();TW.expand()}}catch(e){}try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const cGet=keys=>new Promise(r=>{try{TW.CloudStorage.getItems(keys,(e,v)=>r(e?null:v))}catch(e){r(null)}});
const cSet=(k,v)=>new Promise(r=>{try{TW.CloudStorage.setItem(k,v,(e)=>r(!e))}catch(e){r(false)}});
async function cloudSave(name,val){const s=JSON.stringify(val);const parts=[];for(let i=0;i<s.length;i+=3500)parts.push(s.slice(i,i+3500));for(let i=0;i<parts.length;i++)await cSet(name+'_'+i,parts[i]);await cSet(name+'_n',String(parts.length))}
async function cloudLoad(name){const n=await cGet([name+'_n']);if(!n||!n[name+'_n'])return null;const cnt=+n[name+'_n'];const keys=[...Array(cnt)].map((_,i)=>name+'_'+i);const v=await cGet(keys);if(!v)return null;try{return JSON.parse(keys.map(k=>v[k]||'').join(''))}catch(e){return null}}
const FB='https://hyeopchan-share-default-rtdb.firebaseio.com/s/7l7h3zdabsivx23c';const sk=k=>encodeURIComponent(String(k).replace(/[.#$\[\]\/%]/g,'_'));const sid=k=>String(k).replace(/[.#$\[\]\/%]/g,'_');
if(ls.get('hc_mig_뀨',false))ls.set('hc_mig_규영',true);if(ls.get('hc_who',null)==='뀨')ls.set('hc_who','규영');const WHO={'6961832390':'규영','8779817791':'수지'};let ME=(TW&&TW.initDataUnsafe&&TW.initDataUnsafe.user&&WHO[String(TW.initDataUnsafe.user.id)])||ls.get('hc_who',null);if(ME)ls.set('hc_who',ME);
let SH={pick:{},hide:{},kw:{}},pickBy=new Map(),ONLINE=false;
function apply(){SH=SH||{};hide=new Set(Object.values(SH.hide||{}).map(x=>x&&x.k).filter(Boolean));kws=Object.values(SH.kw||{}).map(x=>x&&x.w).filter(Boolean);pickBy=new Map();for(const v of Object.values(SH.pick||{})){if(!v||!v.k)continue;const n=Object.keys(v.by||{});if(n.length)pickBy.set(v.k,n)}pick=new Set([...pickBy].filter(([k,n])=>n.includes(ME)).map(([k])=>k));ls.set('hc_sh',SH)}
async function fb(path,method,body){try{const r=await fetch(FB+path+'.json',{method:method||'GET',body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok)throw 0;return method&&method!=='GET'?true:await r.json()}catch(e){if(method&&method!=='GET')toast('저장이 안 됐어요. 인터넷 확인 후 다시 눌러 주세요');return null}}
async function pull(){const j=await fb('');if(j!==null){SH=j||{};ONLINE=true;apply();if(D.length)draw()}}
function setPick(k,on){const p='/pick/'+sk(k);SH.pick=SH.pick||{};const id=sid(k);const cur=SH.pick[id]||{k,by:{}};cur.by=cur.by||{};if(on){cur.by[ME]=Date.now();SH.pick[id]=cur;fb(p+'/k','PUT',k);fb(p+'/by/'+encodeURIComponent(ME),'PUT',Date.now())}else{delete cur.by[ME];SH.pick[id]=cur;fb(p+'/by/'+encodeURIComponent(ME),'DELETE')}apply()}
function setHide(k,on){SH.hide=SH.hide||{};const id=sid(k);if(on){SH.hide[id]={k,by:ME,t:Date.now()};fb('/hide/'+sk(k),'PUT',SH.hide[id])}else{delete SH.hide[id];fb('/hide/'+sk(k),'DELETE')}apply()}
function setKw(w,on){SH.kw=SH.kw||{};const id=sid(w);if(on){SH.kw[id]={w,by:ME,t:Date.now()};fb('/kw/'+sk(w),'PUT',SH.kw[id])}else{delete SH.kw[id];fb('/kw/'+sk(w),'DELETE')}apply()}
async function migrate(){if(!ME||ls.get('hc_mig_'+ME,false))return;let P=[...ls.get('hc_pick',[])],Hh=[...ls.get('hc_hide',[])],K=[...ls.get('hc_kw',[])];if(CLOUD){const [h2,p2,k2]=[await cloudLoad('hide'),await cloudLoad('pick'),await cloudLoad('kw')];if(h2)Hh=Hh.concat(h2);if(p2)P=P.concat(p2);if(k2)K=K.concat(k2)}for(const k of new Set(P))if(!pick.has(k))setPick(k,true);for(const k of new Set(Hh))if(!hide.has(k))setHide(k,true);for(const w of new Set(K))if(!kws.includes(w))setKw(w,true);ls.set('hc_mig_'+ME,true)}
async function cloudInit(){SH=ls.get('hc_sh',{pick:{},hide:{},kw:{}});apply();await pull();if(ME&&ONLINE)await migrate()}
function whoSheet(){$('shc').innerHTML='<h3>누가 보고 있나요?</h3><p class="note">규영와 수지가 같은 목록을 같이 써요. 담은 건 이름이 붙어서 서로 보이고, 가린 건 둘 다 안 보여요.</p><button class="big btn-p" data-who="규영">규영</button><button class="big btn-p" data-who="수지">수지</button>';$('sh').classList.add('on')}
setInterval(()=>{if(!document.hidden)pull()},20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
let STA={items:[],rules:{visitPerWeek:3}};const T=[['M','내 현황'],['C','창원 주말 가능'],['U','창원 주말 확인 필요'],['N','창원 평일만'],['S','배송 제품'],['P','페이백·구매'],['K','기자단·재택']];
let st={g:'M',chip:'전체',q:'',sort:'d'};const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kst=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);let today=kst(),tom=new Date(Date.now()+33*3600e3).toISOString().slice(0,10);
const md=s=>s?(+s.slice(5,7))+'/'+(+s.slice(8,10)):'';const dw=s=>s?'일월화수목금토'[new Date(s+'T00:00:00+09:00').getDay()]:'';const kr=d=>(d.a==null||!d.q)?null:d.a/d.q;
const wmap={'토만':'토요일만','일만':'일요일만','추정':'주말 가능(추정)','토만·추정':'토요일만(추정)','일만·추정':'일요일만(추정)'};
const kwHit=d=>kws.find(k=>k&&(d.n+' '+d.t).toLowerCase().includes(k.toLowerCase()));
const live=d=>!d.e||d.e>=today;const applied=d=>d.ap||(STA.items||[]).some(x=>(x.ks||[]).includes(d.k));const visible=d=>live(d)&&!hide.has(d.k)&&!kwHit(d)&&!applied(d);
function chipsFor(g){const L=D.filter(d=>d.g===g&&visible(d));const cats=[...new Set(L.map(d=>d.c).filter(Boolean))].sort((a,b)=>L.filter(d=>d.c===b).length-L.filter(d=>d.c===a).length);let c=['전체',...cats.filter(x=>x!=='기타')];if(cats.includes('기타'))c.push('기타');if('CUN'.includes(g))c=c.concat(['성산구','의창구','마산합포구','마산회원구','진해구'].filter(x=>L.some(d=>d.gu===x)));if(g==='C')c.push('토요일 가능','일요일 가능');if(L.some(d=>d.nw===META.date))c.splice(1,0,'오늘 새로');if('SPK'.includes(g)&&L.some(d=>d.e===tom))c.splice(1,0,'오늘 신청 타이밍');return c}
function pass(d){const c=st.chip;if(c==='전체')return true;if(c==='오늘 새로')return d.nw===META.date;if(c==='오늘 신청 타이밍')return d.e===tom;if(c==='토요일 가능')return!/일만/.test(d.w||'');if(c==='일요일 가능')return!/토만/.test(d.w||'');if(/구$/.test(c))return d.gu===c;return d.c===c}
function kb(d){const k=kr(d);if(k==null)return'';const t='지원 '+d.a+' · 모집 '+d.q;return k<1?'<span class="b k1">여유 · '+t+'</span>':k<5?'<span class="b k2">경쟁 낮음 · '+t+'</span>':k<20?'<span class="b">'+t+'</span>':'<span class="b k3">경쟁 치열 · '+t+'</span>'}
function db(d){if(!d.e)return'';if(d.e===today)return'<span class="b d1">오늘 마감</span>';if(d.e===tom)return'<span class="b d2">내일 마감</span>';return'<span class="b">'+md(d.e)+'('+dw(d.e)+') 마감</span>'}
function ppl(d){if(!'CUN'.includes(d.g))return'';const m=((d.o||'')+' '+d.n).match(/([1-9])\s*인/);if(!m)return'';const n=+m[1];return'<span class="b pp">'+(n===1?'1인 (혼자)':n===2?'2인 (둘이)':n+'인 (친구도)')+'</span>'}
function wk(s){const d=new Date(s+'T00:00:00+09:00');const day=d.getDay();const sat=new Date(d.getTime()+((6-day+7)%7)*864e5);return sat.toISOString().slice(0,10)}
function wkStart(s){const d=new Date(s+'T00:00:00+09:00');const day=(d.getDay()+6)%7;return new Date(d.getTime()-day*864e5+9*3600e3).toISOString().slice(0,10)}
function weekends(n){const out=[];let d=new Date(today+'T00:00:00+09:00');while(d.getDay()!==6)d=new Date(d.getTime()+864e5);if(new Date(today+'T00:00:00+09:00').getDay()===0)d=new Date(d.getTime()-7*864e5);for(let i=0;i<n;i++){const sat=new Date(d.getTime()+i*7*864e5+9*3600e3).toISOString().slice(0,10);const sun=new Date(d.getTime()+(i*7+1)*864e5+9*3600e3).toISOString().slice(0,10);out.push([sat,sun])}return out}
function visitLoad(){const R=STA.rules||{};const wk0=wkStart(today);const I=STA.items||[];const ap=I.filter(x=>x.type==='방문'&&x.applied&&wkStart(x.applied)===wk0).length;const pend=I.filter(x=>x.type==='방문'&&x.state==='발표전').length;const pk=D.filter(d=>'CUN'.includes(d.g)&&pickBy.has(d.k)&&live(d)&&!hide.has(d.k)).length;return{ap,pend,pk,maxAp:R.visitApplyPerWeek||3,maxC:R.visitConfirmPerWeek||2}}
function meter(){const v=visitLoad();const over=v.ap>=v.maxAp;const W=weekends(1)[0];const busy=(STA.busy||[]).some(b=>b.d===W[0]||b.d===W[1]);return'<div class="meter'+(over?' over':'')+'"><b>이번 주 방문형 신청 '+v.ap+'/'+v.maxAp+'</b> · 발표 대기 '+v.pend+' · 두 분이 담음 '+v.pk+'<br>실제 방문은 한 주 최대 '+v.maxC+'곳 · 발표 빠른 것부터 신청'+(busy?'<br><b>이번 주말('+md(W[0])+'~'+md(W[1])+')은 부부 일정이 있어요. 방문형은 피해요</b>':'')+(over?'<br>이번 주 신청 한도를 채웠어요':'')+'</div>'}
function plan(){const I=STA.items||[];const R=STA.rules||{};return'<div class="sub" style="margin:16px 4px 6px;font-weight:800;color:#0e3f46">주말 계획</div><div class="plan">'+weekends(5).map(([sa,su])=>{const busy=(STA.busy||[]).filter(b=>b.d===sa||b.d===su);const conf=I.filter(x=>x.type==='방문'&&x.state!=='발표전'&&x.visit&&(x.visit===sa||x.visit===su));const n=conf.length;const st=busy.length?'<span class="b d1">부부 일정 있음 · 방문형 피하기</span>':n>=(R.visitConfirmPerWeek||2)?'<span class="b d2">꽉 참</span>':'<span class="b k1">'+((R.visitConfirmPerWeek||2)-n)+'곳 비어 있음</span>';return'<div class="pr"><b>'+md(sa)+'(토)~'+md(su)+'(일)</b> '+st+(conf.length?'<div class="ms">'+conf.map(x=>esc(x.n)).join(', ')+'</div>':'')+'</div>'}).join('')+'</div>'}
function dd(s){if(!s)return'';const n=Math.round((Date.parse(s+'T00:00:00+09:00')-Date.parse(today+'T00:00:00+09:00'))/864e5);return n<0?'지남':n===0?'D-day':'D-'+n}
function stItem(x){const col=x.type==='방문'?'v':'s';return'<div class="card st '+col+'"><div class="r1"><a class="nm" href="'+esc(x.u||'#')+'" target="_blank" rel="noopener">'+esc(x.n)+'</a></div><div class="bs"><span class="b ty-'+col+'">'+esc(x.type)+'</span><span class="b">'+esc(x.s)+'</span>'+(x.ann&&x.state==='발표전'?'<span class="b">발표 '+md(x.ann)+'('+dw(x.ann)+') '+dd(x.ann)+'</span>':'')+(x.visit?'<span class="b w">방문 '+md(x.visit)+'</span>':'')+(x.due?'<span class="b '+(x.state==='확정'?'d1':'')+'">리뷰 마감 '+md(x.due)+' '+(x.state!=='완료'?dd(x.due):'')+'</span>':'')+'</div>'+(x.todo?'<div class="ms"><b>할 일</b> '+esc(x.todo)+'</div>':'')+(x.note?'<div class="ms">'+esc(x.note)+'</div>':'')+'</div>'}
function drawStatus(){const I=STA.items||[];const sec=(t,L,e)=>'<div class="sub" style="margin:16px 4px 6px;font-weight:800;color:#0e3f46">'+t+' '+L.length+'</div>'+(L.length?L.map(stItem).join(''):'<div class="empty">'+e+'</div>');const by=(a,b)=>(a.due||a.ann||'').localeCompare(b.due||b.ann||'');
 return'<div class="rule"><b>우리 규칙</b><br>'+((STA.rules&&STA.rules.text)||[]).map(t=>'· '+esc(t)).join('<br>')+'<br>· 일정: 구글 캘린더 "협찬(발표전_마감일정)" "협찬(확정_마감일정)" (주황=방문, 파랑=배송)</div>'+meter()+plan()
 +sec('확정 · 리뷰 써야 할 것',I.filter(x=>x.state==='확정').sort(by),'지금은 없어요')+sec('발표 기다리는 것',I.filter(x=>x.state==='발표전').sort((a,b)=>(a.ann||'').localeCompare(b.ann||'')),'없어요')+sec('끝난 것',I.filter(x=>x.state==='완료'),'없어요')+'<p class="note">현황 업데이트 '+esc(STA.updated||'')+'</p>'}
function card(d){const on=pick.has(d.k);const by=pickBy.get(d.k)||[];return'<div class="card'+(on?' sel':by.length?' sel2':'')+'" data-k="'+esc(d.k)+'"><div class="r1"><a class="nm" href="'+esc(d.u)+'" target="_blank" rel="noopener">'+esc(d.n)+'</a></div><div class="sub">'+esc([d.c,d.t].filter(Boolean).join(' · '))+'</div><div class="bs">'+by.map(n=>'<span class="b pk">'+esc(n)+' 담음</span>').join('')+(d.nw===META.date?'<span class="b nw">새로</span>':'')+'<span class="b s-'+d.s+'">'+d.s+'</span>'+db(d)+(d.w?'<span class="b w">'+(wmap[d.w]||d.w)+'</span>':'')+(d.gu&&'CUN'.includes(d.g)?'<span class="b gu">'+d.gu+'</span>':'')+kb(d)+(d.x||[]).map(x=>'<span class="b x">'+esc(x)+'</span>').join('')+(d.ap?'<span class="b ap">이미 신청함</span>':'')+('SPK'.includes(d.g)&&d.e===tom?'<span class="b d2">오늘 신청 타이밍</span>':'')+'</div>'+(d.m?'<div class="ms">'+esc(d.m)+'</div>':'')+'<div class="acts"><button class="add">'+(on?'담음':'담기')+'</button><button class="hide">가리기</button></div></div>'}
function draw(){today=kst();
 $('tabs').innerHTML=T.map(([g,l])=>'<button class="tab'+(st.g===g?' on':'')+'" data-g="'+g+'">'+l+'<i>'+(g==='M'?(STA.items||[]).filter(x=>x.state!=='완료').length:D.filter(d=>d.g===g&&visible(d)).length)+'</i></button>').join('');
 const tb=document.querySelector('.tools');if(st.g==='M'){if(tb)tb.style.display='none';$('ch').innerHTML='';$('sum').textContent='';$('hid').textContent='';$('m').innerHTML=drawStatus();$('n').textContent=picked().length;return}if(tb)tb.style.display='';
 const cs=chipsFor(st.g);if(!cs.includes(st.chip))st.chip='전체';$('ch').innerHTML=cs.map(c=>'<button class="chip'+(st.chip===c?' on':'')+(/구$/.test(c)?' gu':'')+(/요일|새로/.test(c)?' tg':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join('');
 const q=st.q.trim().toLowerCase();let L=D.filter(d=>d.g===st.g&&visible(d)&&pass(d)&&(!q||(d.n+' '+d.t+' '+(d.o||'')).toLowerCase().includes(q)));
 if(st.sort==='k')L.sort((a,b)=>(kr(a)??1e9)-(kr(b)??1e9));else if(st.sort==='n')L.sort((a,b)=>(b.nw||'').localeCompare(a.nw||'')||(a.e||'').localeCompare(b.e||''));
 $('sum').textContent=L.length+'개'+(st.chip!=='전체'?' · '+st.chip:'')+(q?' · "'+st.q+'"':'');const hc=D.filter(d=>live(d)&&(hide.has(d.k)||kwHit(d))).length;$('hid').textContent=hc?'가린 것 '+hc+'개':'';
 let h='',last='';for(const d of L){if(st.sort==='d'&&d.e!==last){last=d.e;h+='<div class="sub" style="margin:14px 4px 4px;font-weight:800;color:'+(d.e===today?'#b91c1c':'#0e3f46')+'">'+(d.e===today?'오늘 마감':d.e===tom?'내일 마감':md(d.e)+'('+dw(d.e)+') 마감')+'</div>'}h+=card(d)}
 $('m').innerHTML=('CUN'.includes(st.g)?meter():'')+(h||'<div class="empty">조건에 맞는 게 없어요</div>');$('n').textContent=picked().length;$('me').textContent=ME?ME+'로 보는 중':''}
function toast(t){const x=$('to');x.textContent=t;x.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.display='none',1800)}
const TY=d=>'CUN'.includes(d.g)?'방문·체험':d.g==='S'?'배송':d.g==='P'?'페이백·구매':'기자단·재택';const TYO={'방문·체험':0,'배송':1,'페이백·구매':2,'기자단·재택':3};
function picked(){return D.filter(d=>pickBy.has(d.k)&&live(d)&&!hide.has(d.k)&&!applied(d)).sort((a,b)=>TYO[TY(a)]-TYO[TY(b)]||(a.e||'').localeCompare(b.e||''))}
function text(){const L=picked();let out='신청해줘 ('+L.length+'개)',cur='',i=0;for(const d of L){const t=TY(d);if(t!==cur){cur=t;out+='\n\n■ '+t+' '+L.filter(x=>TY(x)===t).length+'개'}i++;out+='\n'+i+'. ['+(pickBy.get(d.k)||[]).join('·')+'] '+d.n+' ('+d.t+(d.gu&&'CUN'.includes(d.g)?' · '+d.gu:'')+') ['+d.s+' · '+md(d.e)+' 마감] '+d.u}return out}
function sheetPick(){const L=picked();$('shc').innerHTML='<h3>담은 것 '+L.length+'개</h3>'+(L.length?L.map(d=>(i=>i)('')+'<div class="li"><span><b class="ty">'+TY(d)+'</b> <b class="who">'+esc((pickBy.get(d.k)||[]).join('·'))+'</b> '+esc(d.n)+'<br><small>'+esc(d.t)+' · '+d.s+' · '+md(d.e)+' 마감</small></span>'+(pick.has(d.k)?'<button data-unpick="'+esc(d.k)+'">빼기</button>':'')+'</div>').join(''):'<div class="empty">아직 담은 게 없어요</div>')+'<button class="big btn-p" id="send">텔레그램으로 보내기</button><button class="big btn-l" id="copy">복사만 하기</button><button class="big btn-l" id="clrp">내가 담은 것 비우기</button><p class="note">보내기를 누르면 텔레그램이 열려요. 블로그 봇 대화방이나 부부 방을 골라 보내 주시면 돼요. 빼기는 내가 담은 것에만 보여요.</p>';$('sh').classList.add('on')}
function sheetMng(){const H=D.filter(d=>live(d)&&hide.has(d.k));$('shc').innerHTML='<h3>단어로 가리기</h3><p class="note">이 단어가 이름에 들어간 건 지금 있는 것도, 내일 새로 올라오는 것도 다 가려져요.</p><div class="kwrow"><input id="kwi" placeholder="예: 소개팅, 웨딩"><button id="kwa">추가</button></div><div class="kws">'+kws.map((k,i)=>'<span class="kw">'+esc(k)+'<button data-kwdel="'+i+'">✕</button></span>').join('')+'</div><h3 style="margin-top:16px">하나씩 가린 것 '+H.length+'개</h3>'+(H.length?H.map(d=>'<div class="li"><span>'+esc(((Object.values(SH.hide||{}).find(x=>x&&x.k===d.k)||{}).by||'')+' ')+esc(d.n)+'<br><small>'+esc(d.t)+' · '+d.s+'</small></span><button data-unhide="'+esc(d.k)+'">다시 보기</button></div>').join(''):'<div class="note">아직 없어요. 카드의 가리기를 누르면 여기 모여요.</div>')+'<p class="note" style="margin-top:14px">'+'규영와 수지가 같이 쓰는 목록이에요. 어느 폰, 어느 앱으로 열어도 같은 내용이 보이고 매일 목록이 바뀌어도 그대로예요. 한 사람이 가리면 둘 다 안 보여요.'+(ME?' 지금은 <b>'+esc(ME)+'</b>(으)로 보는 중 · <a href="#" data-chwho="1">바꾸기</a>':'')+'</p>';$('sh').classList.add('on')}
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}a.remove();return ok}}
document.addEventListener('click',async e=>{const t=e.target;
 if(t.closest('.tab')){st.g=t.closest('.tab').dataset.g;st.chip='전체';draw();scrollTo(0,0);return}
 if(t.closest('.chip')){st.chip=t.closest('.chip').dataset.c;draw();return}
 const c=t.closest('.card');if(c&&t.classList.contains('add')){if(!ME){whoSheet();return}const k=c.dataset.k;const it=D.find(x=>x.k===k);if(!pick.has(k)&&it&&'CUN'.includes(it.g)){const v=visitLoad();if(v.ap>=v.maxAp&&!confirm('이번 주 방문형 신청 '+v.maxAp+'개를 이미 채웠어요. 그래도 담을까요?'))return}setPick(k,!pick.has(k));draw();return}
 if(c&&t.classList.contains('hide')){if(!ME){whoSheet();return}const k=c.dataset.k;setHide(k,true);c.style.display='none';toast('가렸어요. 위의 가리기 관리에서 되돌릴 수 있어요');draw();return}
 if(t.dataset.unpick){setPick(t.dataset.unpick,false);sheetPick();draw();return}
 if(t.dataset.unhide){setHide(t.dataset.unhide,false);sheetMng();draw();return}
 if(t.dataset.kwdel!=null){setKw(kws[+t.dataset.kwdel],false);sheetMng();draw();return}if(t.dataset.who){ME=t.dataset.who;ls.set('hc_who',ME);apply();$('sh').classList.remove('on');if(ONLINE)migrate();draw();toast(ME+'(으)로 볼게요');return}if(t.dataset.chwho){e.preventDefault();whoSheet();return}
 if(t.id==='kwa'){const v=$('kwi').value.trim();if(v&&!kws.includes(v)){if(!ME){whoSheet();return}setKw(v,true)}sheetMng();draw();return}
 if(t.id==='send'){const L=picked();if(!L.length){toast('먼저 담아 주세요');return}const tx=text();await copy(tx);const sh='https://t.me/share/url?url='+encodeURIComponent('https://t.me/Blog4451bot')+'&text='+encodeURIComponent(tx);if(TW&&TW.openTelegramLink&&CLOUD){TW.openTelegramLink(sh)}else{location.href=sh}return}
 if(t.id==='copy'){if(!picked().length){toast('먼저 담아 주세요');return}toast(await copy(text())?'복사했어요':'복사가 안 됐어요');return}
 if(t.id==='clrp'){if(confirm('내가 담은 것을 비울까요?')){[...pick].forEach(k=>setPick(k,false));sheetPick();draw()}return}
 if(t.id==='sh'){$('sh').classList.remove('on')}});
$('q').oninput=e=>{st.q=e.target.value;draw()};$('sort').onchange=e=>{st.sort=e.target.value;draw()};$('see').onclick=sheetPick;$('cp').onclick=sheetPick;$('mng').onclick=sheetMng;
cloudInit().then(()=>fetch('status.json?v='+Date.now()).then(r=>r.ok?r.json():null).then(j=>{if(j)STA=j}).catch(()=>{})).then(()=>fetch('data.json?v='+Date.now())).then(r=>r.json()).then(j=>{D=j.items;META=j;$('upd').textContent=j.date.slice(5).replace('-','/')+' '+(j.time||'')+' 업데이트';draw();if(!ME)whoSheet()}).catch(e=>{$('m').innerHTML='<div class="empty">목록을 못 불러왔어요. 잠시 뒤 새로고침해 주세요.</div>'});
</script></body></html>
